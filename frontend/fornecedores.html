<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FestKids | Fornecedores</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
    <header class="cabecalho"><a class="marca" href="index.html"><span class="marca-icone">F</span><span>FestKids</span></a><nav class="navegacao" aria-label="Cadastros principais"><a href="index.html">Clientes</a><a class="ativo" href="fornecedores.html">Fornecedores</a><a href="servicos.html">Serviços</a><a href="festas.html">Festas</a></nav></header>
    <main class="pagina-gestao"><section class="titulo-gestao"><div><p class="etiqueta">Cadastros</p><h1>Fornecedores</h1><p>Empresas e profissionais que oferecem serviços.</p></div><span class="selo">Disponibilidade geral</span></section><div class="grade-gestao">
        <section class="cartao-formulario"><div class="cabecalho-formulario"><p class="etiqueta">Formulário</p><h2 id="titulo-formulario">Novo fornecedor</h2></div><form id="formulario-fornecedor"><input id="fornecedor-id" type="hidden"><div class="campo"><label for="nome-comercial">Nome comercial</label><input id="nome-comercial" maxlength="120" required></div><div class="campo"><label for="email">E-mail</label><input id="email" type="email" maxlength="255" required></div><div class="campo"><label for="telefone">Telefone</label><input id="telefone" type="tel" maxlength="20" required></div><label class="campo-checkbox"><input id="disponivel" type="checkbox" checked><span>Fornecedor disponível para novas seleções</span></label><div id="mensagem-formulario" class="mensagem" role="status" aria-live="polite"></div><div class="acoes-formulario"><button id="botao-salvar" type="submit">Salvar fornecedor</button><button id="botao-cancelar" class="botao-secundario" type="button" hidden>Cancelar edição</button></div></form></section>
        <section class="cartao-lista"><div class="cabecalho-lista"><div><p class="etiqueta">Registros</p><h2>Fornecedores cadastrados</h2></div><button id="botao-atualizar" class="botao-pequeno" type="button">Atualizar</button></div><div id="estado-lista" class="estado-lista" role="status">Carregando fornecedores...</div><div id="lista-fornecedores" class="lista-registros"></div></section>
    </div></main><script src="js/api.js"></script><script src="js/fornecedores.js"></script>
</body></html>
