<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FestKids | Festas</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<header class="cabecalho"><a class="marca" href="index.html"><span class="marca-icone">F</span><span>FestKids</span></a><nav class="navegacao" aria-label="Navegação principal"><a href="index.html">Início</a><a href="clientes.html">Clientes</a><a href="fornecedores.html">Fornecedores</a><a href="servicos.html">Serviços</a><a class="ativo" aria-current="page" href="festas.html">Festas</a><a href="planejamento.html">Planejamento</a></nav></header>
    <main class="pagina-gestao"><section class="titulo-gestao"><div><p class="etiqueta">Cadastros</p><h1>Festas</h1><p>Eventos que seguirão para o planejamento.</p></div><span class="selo">Status inicial: RASCUNHO</span></section><div class="grade-gestao">
        <section class="cartao-formulario"><div class="cabecalho-formulario"><p class="etiqueta">Formulário</p><h2 id="titulo-formulario">Nova festa</h2></div><form id="formulario-festa"><input id="festa-id" type="hidden"><div class="campo"><label for="cliente-id">Cliente responsável</label><select id="cliente-id" required></select></div><div class="campo"><label for="nome">Nome da festa</label><input id="nome" maxlength="120" required></div><div class="linha-campos"><div class="campo"><label for="data">Data</label><input id="data" type="date" required></div><div class="campo"><label for="convidados">Convidados</label><input id="convidados" type="number" min="1" required></div></div><div class="campo"><label for="local">Local</label><input id="local" maxlength="180" required></div><div class="campo"><label for="orcamento">Orçamento</label><input id="orcamento" type="number" min="0.01" step="0.01" required></div><div id="mensagem-formulario" class="mensagem" role="status" aria-live="polite"></div><div class="acoes-formulario"><button id="botao-salvar" type="submit">Salvar festa</button><button id="botao-cancelar" class="botao-secundario" type="button" hidden>Cancelar edição</button></div></form></section>
        <section class="cartao-lista"><div class="cabecalho-lista"><div><p class="etiqueta">Registros</p><h2>Festas cadastradas</h2></div><button id="botao-atualizar" class="botao-pequeno" type="button">Atualizar</button></div><div id="estado-lista" class="estado-lista" role="status">Carregando festas...</div><div id="lista-festas" class="lista-registros"></div></section>
    </div></main><script src="js/api.js"></script><script src="js/festas.js"></script>
</body></html>
